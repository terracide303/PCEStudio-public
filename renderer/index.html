<!doctype html>
<!-- PCEStudio background renderer — browser view (cards #5 and #9).
     Shows the renderer's output next to Mednafen's F9 screenshot for the
     three test dumps, and exports the same picture as a .pce: the constant
     viewer code bank (renderer/viewer-bank0.bin) plus the picture's data
     banks, built by renderer/pce-rom.js.  Bank 0 is identical to the PCEAS
     build's, and when tools/gen/viewerN.pce has been built the page says
     whether the two files are byte-for-byte equal.
     Serve the repo root and open renderer/index.html:
         python3 -m http.server 8000
     Dumps live in tests/dumps/sceneN/ (see tools/capture.sh). -->
<html>
<head>
<meta charset="utf-8">
<title>PCEStudio — background renderer</title>
<style>
  body { font: 14px system-ui, sans-serif; background: #111; color: #ddd;
         margin: 1.5rem; }
  h1 { font-size: 1.2rem; }
  .row { display: flex; gap: 2rem; align-items: flex-start; }
  figure { margin: 0.5rem 0; }
  figcaption { margin-bottom: 0.3rem; color: #aaa; }
  canvas { image-rendering: pixelated; background: #000; }
  #status { color: #f88; white-space: pre; }
  #exportstatus { color: #8f8; white-space: pre; }
  #download { font: inherit; }
  #download[disabled] { opacity: 0.4; }
</style>
</head>
<body>
<h1>PCEStudio background renderer — renderer vs Mednafen F9, export .pce</h1>
<p><label>scene
  <select id="scene">
    <option value="scene1">scene1 — flat</option>
    <option value="scene2">scene2 — scroll</option>
    <option value="scene3">scene3 — wide</option>
  </select>
</label>
<span id="status"></span></p>
<div class="row">
  <figure>
    <figcaption>renderer/pce-bg.js</figcaption>
    <canvas id="out" width="256" height="232"></canvas>
  </figure>
  <figure>
    <figcaption>mednafen.png (F9, raw)</figcaption>
    <canvas id="ref" width="256" height="232"></canvas>
  </figure>
</div>
<p>
  <button id="download" disabled>Download .pce</button>
  <label><input type="checkbox" id="us">
    TurboGrafx HuCard (US — every byte's bits reversed)</label>
  <span id="exportstatus"></span>
</p>
<script src="pce-bg.js"></script>
<script src="pce-rom.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const status = (t) => { $("status").textContent = t; };
const exportStatus = (t) => { $("exportstatus").textContent = t; };

let bank0 = null;          // the constant viewer code bank, fetched once
let picture = null;        // the scene's data for pce-rom.js
let sceneName = null;
let romPce = null;         // the scene's PC Engine bytes, before any reversal
let romUrl = null;
let downloadName = "picture.pce";

function putImage(canvas, img) {
  const ctx = canvas.getContext("2d");
  const data = ctx.createImageData(canvas.width, canvas.height);
  data.data.set(img.pixels.subarray
    ? img.pixels.subarray(0, data.data.length)
    : img.pixels.slice(0, data.data.length));
  ctx.putImageData(data, 0, 0);
}

async function loadPng(url) {
  const blob = await (await fetch(url)).blob();
  const bmp = await createImageBitmap(blob);
  const ctx = $("ref").getContext("2d");
  ctx.drawImage(bmp, 0, 0);
}

async function loadBank0() {
  if (!bank0) {
    const res = await fetch("viewer-bank0.bin");
    if (!res.ok) throw new Error(`viewer-bank0.bin: HTTP ${res.status}`);
    bank0 = new Uint8Array(await res.arrayBuffer());
  }
  return bank0;
}

async function hexSha256(bytes) {
  if (!crypto.subtle) return null;
  const d = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(d))
    .map((b) => b.toString(16).padStart(2, "0")).join("");
}

/* Compare the browser's bytes with the PCEAS build, if this checkout has
 * one.  tools/gen/ is a build directory (gitignored), so a fresh clone says
 * "not available" rather than failing — the Node test is the authoritative
 * check (tests/check-export.js). */
async function comparePceas(scene, romBytes) {
  const viewer = scene.replace(/^scene/, "viewer");
  let ref;
  try {
    const res = await fetch(`../tools/gen/${viewer}.pce`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    ref = new Uint8Array(await res.arrayBuffer());
  } catch (e) {
    return `built ${romBytes.length} bytes; PCEAS reference not available ` +
           `here (${e.message})`;
  }
  let diffs = 0, first = -1;
  if (ref.length === romBytes.length) {
    for (let i = 0; i < ref.length; i++) {
      if (ref[i] !== romBytes[i]) { diffs++; if (first < 0) first = i; }
    }
  } else {
    diffs = -1;
  }
  const sha = await hexSha256(romBytes);
  if (diffs === 0)
    return `built ${romBytes.length} bytes, sha256 ${sha.slice(0, 16)}… — ` +
           `byte-for-byte equal to the PCEAS build`;
  if (diffs > 0)
    return `DIFFERS from the PCEAS build: ${diffs} bytes, first at 0x` +
           `${first.toString(16)}`;
  return `DIFFERS from the PCEAS build: ${romBytes.length} vs ${ref.length} bytes`;
}

function offerDownload(romBytes, name) {
  if (romUrl) URL.revokeObjectURL(romUrl);
  romUrl = URL.createObjectURL(
    new Blob([romBytes], { type: "application/octet-stream" }));
  downloadName = name;
  $("download").disabled = false;
}

/* #25: the US HuCard (TurboGrafx-16) image is the .pce with every byte's bits
 * reversed.  The checkbox swaps which bytes the button offers; the PCEAS
 * comparison always talks about the .pce itself. */
async function rebuildExport() {
  if (!romPce) return;
  const base = sceneName.replace(/^scene/, "picture");
  if ($("us").checked) {
    const us = PCEStudio.rom.reverseBits(romPce);
    let differ = 0;
    for (let i = 0; i < us.length; i++) if (us[i] !== romPce[i]) differ++;
    offerDownload(us, `${base}-us.pce`);
    const sha = await hexSha256(us);
    exportStatus(`US HuCard: ${us.length} bytes, every byte the bit-reverse of ` +
                 `the .pce (${differ} bytes differ)` +
                 (sha ? `, sha256 ${sha.slice(0, 16)}…` : ""));
  } else {
    offerDownload(romPce, `${base}.pce`);
    exportStatus(await comparePceas(sceneName, romPce));
  }
}

$("download").addEventListener("click", () => {
  if (!romUrl) return;
  const a = document.createElement("a");
  a.href = romUrl;
  a.download = downloadName;
  document.body.appendChild(a);
  a.click();
  a.remove();
});

$("us").addEventListener("change", () => { rebuildExport(); });

async function show(scene) {
  const base = `../tests/dumps/${scene}/`;
  try {
    status(`loading ${scene}…`);
    exportStatus("");
    $("download").disabled = true;
    const [vram, cram, regs, regionsDoc, code] = await Promise.all([
      (await fetch(base + "vram.bin")).arrayBuffer(),
      (await fetch(base + "cram.bin")).arrayBuffer(),
      (await fetch(base + "regs.json")).json(),
      (await fetch(base + "regions.json")).json(),
      loadBank0(),
    ]);
    picture = {
      vram: new Uint8Array(vram),
      cram: new Uint8Array(cram),
      regs,
      regions: regionsDoc.tile_regions,
      bank0: code,
    };
    sceneName = scene;

    const frame = PCEStudio.bg.renderFrame({
      vram: picture.vram,
      cram: picture.cram,
      regs,
      width: 256,
      height: 232,
    });
    putImage($("out"), frame);
    await loadPng(base + "mednafen.png");

    const romBytes = PCEStudio.rom.buildRom(picture);
    romPce = romBytes;
    await rebuildExport();
    status(`scanline ${regs.scanline}, BG_YOffset ${regs.BG_YOffset}, BYR ${regs.BYR}`);
  } catch (e) {
    status(`error: ${e}`);
    exportStatus("");
  }
}

$("scene").addEventListener("change", (ev) => show(ev.target.value));
/* ?scene=scene2 opens a given scene (the headless check uses it); ?us=1
 * opens with the TurboGrafx checkbox ticked, so the US path can be run from
 * the command line without synthesizing a click (the headless check). */
const wanted = new URLSearchParams(location.search).get("scene");
if (wanted && /^scene[123]$/.test(wanted)) $("scene").value = wanted;
if (new URLSearchParams(location.search).get("us") === "1") $("us").checked = true;
show($("scene").value);
</script>
</body>
</html>

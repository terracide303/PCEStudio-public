name: Idea
description: A feature or a change you would like to see.
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like PCEStudio to do, and what would you use it for?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: An example
      description: A game, a tool (ppu.toys, an emulator, a tracker…) or a picture that shows what you mean.
